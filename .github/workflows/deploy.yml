name: Test & Deploy Northgate to Google Cloud Run

on:
  workflow_dispatch:

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REPO: northgate-apps
  SERVICE_NAME: northgate-kyc-chaser

jobs:
  test:
    name: Validate Static Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build TypeScript application
        run: npm run build

      - name: Build Docker image
        run: docker build --tag northgate-kyc-chaser:test .

      - name: Run container smoke test
        shell: bash
        run: |
          docker run --detach --name northgate-smoke --publish 8080:8080 northgate-kyc-chaser:test
          trap 'docker rm --force northgate-smoke' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              echo "Container smoke test passed"
              exit 0
            fi
            sleep 1
          done
          docker logs northgate-smoke
          exit 1

  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 460.0.0"

      - name: Configure Artifact Registry
        run: |
          gcloud config set project "${{ steps.auth.outputs.project_id }}"
          gcloud artifacts repositories create "${{ env.ARTIFACT_REPO }}" \
            --repository-format=docker \
            --location="${{ env.GCP_REGION }}" \
            --description="Docker repository for Northgate KYC Chaser" \
            --project="${{ steps.auth.outputs.project_id }}" \
            --quiet || echo "Artifact Registry repository already exists."
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:${GITHUB_SHA}"
          LATEST="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:latest"
          docker build --tag "$IMAGE" --tag "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy frontend to Cloud Run
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --region "${GCP_REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5

      - name: Publish deployment summary
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          SERVICE_URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${GCP_REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)')"
          {
            echo "### Northgate KYC Chaser deployed"
            echo ""
            echo "| Service | Region | Endpoint |"
            echo "| --- | --- | --- |"
            echo "| ${SERVICE_NAME} | \`${GCP_REGION}\` | [${SERVICE_URL}](${SERVICE_URL}) |"
          } >> "$GITHUB_STEP_SUMMARY"
